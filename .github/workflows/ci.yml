name: CI

on:
  workflow_dispatch:
  # This action is triggered on any branch that opens a pull request.
  push:
    branches:
      - "*"
    # This action is not triggered when markdown files are modified.
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - "*"
    # This action is not triggered when markdown files are modified.
    paths-ignore:
      - '**.md'

env:
  # Permissions env
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # General env
  ELIXIR_VERSION: 1.17
  OTP_VERSION: 27
  # Postgres env
  POSTGRES_PASSWORD: postgres
  POSTGRES_USER: postgres
  POSTGRES_HOSTNAME: localhost

jobs:
  dev:
    runs-on: ubuntu-22.04
    services:
      db:
        image: postgres
        ports: ['5432:5432']
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v2.3.4
      - name: Run Development Checks
        uses: ./.github/actions/dev
        with:
          ELIXIR_VERSION: ${{ env.ELIXIR_VERSION }}
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          MIX_ENV: dev
          OTP_VERSION: ${{ env.OTP_VERSION }}
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres

  test:
    runs-on: ubuntu-22.04
    services:
      db:
        image: postgres
        ports: ['5432:5432']
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v2.3.4
      - name: Run Unit Tests
        uses: ./.github/actions/test
        with:
          ELIXIR_VERSION: ${{ env.ELIXIR_VERSION }}
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          MIX_ENV: test
          OTP_VERSION: ${{ env.OTP_VERSION }}
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres

  prod:
    runs-on: ubuntu-22.04
    services:
      db:
        image: postgres
        ports: ['5432:5432']
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v2.3.4
      - name: Assemble release
        uses: ./.github/actions/prod
        with:
          ELIXIR_VERSION: ${{ env.ELIXIR_VERSION }}
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          MIX_ENV: prod
          OTP_VERSION: ${{ env.OTP_VERSION }}
          POSTGRES_HOSTNAME: ${{ env.POSTGRES_HOSTNAME }}
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
